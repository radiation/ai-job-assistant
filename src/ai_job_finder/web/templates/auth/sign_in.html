<!DOCTYPE html>
<html lang="en" data-csrf-cookie-name="{{ request.app.state.csrf_cookie_name }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In | AI Job Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}" />
    <script defer src="{{ url_for('static', path='js/csrf.js') }}"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth-compat.js"></script>
  </head>
  <body>
    <main class="shell page-shell">
      <section class="panel narrow-panel sign-in-panel"
        data-firebase-api-key="{{ firebase_web_api_key or '' }}"
        data-firebase-auth-domain="{{ firebase_web_auth_domain or '' }}"
        data-firebase-app-id="{{ firebase_web_app_id or '' }}"
        data-firebase-project-id="{{ firebase_project_id or '' }}"
        data-firebase-tenant-id="{{ firebase_tenant_id or '' }}">
        <h1>AI Job Finder</h1>
        <p>Sign in to continue.</p>
        <p class="field-error" id="sign-in-error" hidden></p>
        <button id="google-sign-in" type="button">Sign in with Google</button>
      </section>
    </main>
    <script defer src="{{ url_for('static', path='js/auth.js') }}"></script>
  </body>
</html>
